name: Auto SemVer Tag & GitHub Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      bump:
        description: 'Manual SemVer bump override (auto, patch, minor, major)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: auto-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  semver-tag-and-release:
    name: Compute SemVer, Tag & Publish Release
    runs-on: ubuntu-latest
    # Skip bot auto-bump commits to prevent infinite recursion
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !startsWith(github.event.head_commit.message, 'chore(release): bump version')"
    steps:
      - name: Checkout full history & tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Calculate next SemVer & check if tag exists
        id: ver
        env:
          MANUAL_BUMP: ${{ github.event.inputs.bump || 'auto' }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys
          from pathlib import Path

          def sh(*cmd):
              return subprocess.check_output(cmd, text=True).strip()

          ver_file = Path("VERSION")
          file_ver = ver_file.read_text().strip().lstrip("v") if ver_file.is_file() else "1.0.0"
          if not re.fullmatch(r"\d+\.\d+\.\d+", file_ver):
              file_ver = "1.0.0"

          tags_raw = sh("git", "tag", "--list", "v[0-9]*.[0-9]*.[0-9]*", "--sort=-v:refname")
          tags = [t.strip() for t in tags_raw.splitlines() if t.strip()]
          latest_tag = tags[0] if tags else ""

          # Case 1: VERSION file was bumped manually and tag does not exist yet
          if f"v{file_ver}" not in tags:
              next_ver = file_ver
              bump_needed = False
          else:
              # Case 2: Inspect commits since latest_tag and auto-bump SemVer
              rev_range = f"{latest_tag}..HEAD" if latest_tag else "HEAD"
              msgs = sh("git", "log", "--format=%s%n%b", rev_range)
              if not msgs.strip() and os.environ.get("MANUAL_BUMP", "auto") == "auto":
                  with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                      f.write("should_release=false\n")
                  sys.exit(0)

              major, minor, patch = map(int, latest_tag.lstrip("v").split("."))
              manual = os.environ.get("MANUAL_BUMP", "auto")
              if manual == "major" or re.search(r"(BREAKING CHANGE|^[a-z]+(\([^)]+\))?!:)", msgs, re.M):
                  major, minor, patch = major + 1, 0, 0
              elif manual == "minor" or re.search(r"^feat(\([^)]+\))?:", msgs, re.M):
                  minor, patch = minor + 1, 0
              else:
                  patch += 1
              next_ver = f"{major}.{minor}.{patch}"
              bump_needed = True

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("should_release=true\n")
              f.write(f"version={next_ver}\n")
              f.write(f"tag=v{next_ver}\n")
              f.write(f"prev_tag={latest_tag}\n")
              f.write(f"bump_needed={'true' if bump_needed else 'false'}\n")
          print(f"Resolved next release: v{next_ver} (prev={latest_tag or 'none'}, bump_needed={bump_needed})")
          PY

      - name: Commit bumped VERSION and push annotated SemVer tag atomically
        if: steps.ver.outputs.should_release == 'true'
        env:
          NEXT_VER: ${{ steps.ver.outputs.version }}
          NEXT_TAG: ${{ steps.ver.outputs.tag }}
          BUMP_NEEDED: ${{ steps.ver.outputs.bump_needed }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$BUMP_NEEDED" = "true" ]; then
            echo "${NEXT_VER}" > VERSION
            git add VERSION
            git commit -m "chore(release): bump version to ${NEXT_TAG} [skip ci]"
          fi

          git tag -fa "${NEXT_TAG}" -m "Release ${NEXT_TAG}"

          # Push branch bump + tag in a single atomic transaction with retry so a
          # transient GitHub ref-lock blip can never leave VERSION bumped without a tag.
          push_ok=0
          for attempt in 1 2 3; do
            if [ "$BUMP_NEEDED" = "true" ]; then
              if git push --atomic origin HEAD:main "refs/tags/${NEXT_TAG}"; then
                push_ok=1
                break
              fi
            else
              if git push origin "refs/tags/${NEXT_TAG}"; then
                push_ok=1
                break
              fi
            fi
            delay=$((attempt * 4))
            echo "Attempt ${attempt}/3 failed pushing ${NEXT_TAG}; retrying in ${delay}s..."
            sleep "${delay}"
          done
          if [ "$push_ok" -ne 1 ]; then
            echo "::error::Failed to push ${NEXT_TAG} after 3 attempts"
            exit 1
          fi

      - name: Publish GitHub Release with auto-generated notes
        if: steps.ver.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if gh release view "${NEXT_TAG}" >/dev/null 2>&1; then
            echo "Release ${NEXT_TAG} already exists; skipping create."
            exit 0
          fi
          for attempt in 1 2 3; do
            if gh release create "${NEXT_TAG}" \
              --title "Blue Lodge ${NEXT_TAG}" \
              --generate-notes; then
              exit 0
            fi
            delay=$((attempt * 4))
            echo "Attempt ${attempt}/3 failed creating release ${NEXT_TAG}; retrying in ${delay}s..."
            sleep "${delay}"
          done
          exit 1
