name: Lodge CI / CD Build Gate

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  syntax-and-lint:
    name: Shell Syntax & Integrity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Bash Syntax
        run: |
          echo "Verifying shell syntax across lib/ and commands/..."
          for f in lib/*.sh commands/*.sh; do
            [ -f "$f" ] && bash -n "$f"
          done
          echo "All shell scripts passed syntax inspection."

  gitflow-guard:
    name: GitFlow Branch Protection Audit
    runs-on: ubuntu-latest
    steps:
      - name: Verify Protected Branches
        run: |
          echo "Auditing branch protection rules..."
          echo "Target branch: ${{ github.base_ref || github.ref }}"
          if [ "${{ github.base_ref }}" = "main" ]; then
            echo "ERROR: Direct PRs to main are prohibited by GitFlow policy!"
            exit 1
          fi
          echo "Branch protection policy satisfied."
