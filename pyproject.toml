[project]
name = "blue-lodge"
version = "0.2.0"
description = "George Sovereign Craftsman Engine & Agent Orchestrator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.0",
    "cryptography>=42.0.0",
    "fastjsonschema>=2.19.0",
    "filelock>=3.13.0",
    "gguf>=0.10.0",
    "google-auth>=2.25.0",
    "google-auth-oauthlib>=1.2.0",
    "google-colab-cli>=0.7.0",
    "html2text>=2024.2.26",
    "jsonschema>=4.21.0",
    "jupyter-client>=8.6.0",
    "markdown-it-py>=3.0.0",
    "nbformat>=5.9.0",
    "numpy>=1.26.0",
    "pydantic>=2.6.0",
    "pygments>=2.17.0",
    "pyyaml>=6.0.1",
    "pyzmq>=25.1.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "tqdm>=4.66.0",
    "typer>=0.9.0",
    "websocket-client>=1.7.0",
    "pillow>=10.2.0",
    "onnxruntime>=1.17.0",
    "httpx>=0.27.0",
    "pycardano>=0.19.2",
    "py-clob-client>=0.34.6",
    "cbor2<6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

