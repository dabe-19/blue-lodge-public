# =============================================================================
# SearXNG Metasearch Engine Configuration for Blue Lodge
# =============================================================================
use_default_settings: true

general:
  debug: false
  instance_name: "BlueLodge-Sovereign-Search"

server:
  secret_key: "ultrasecretkey"  # placeholder; SEARXNG_SECRET env (generated by install.sh) overrides it
  limiter: false       # Disable rate limiting for internal container and agent calls
  image_proxy: false
  bind_address: "0.0.0.0"
  port: 8080

outgoing:
  request_timeout: 4.5
  max_request_timeout: 9.0
  # (no `useragent:` override — SearXNG rotates its own browser UAs; a fixed UA got us fingerprinted)

search:
  safe_search: 2
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json             # Essential: enables keyless JSON API queries format=json

engines:
  # ── General Web Engines ───────────────────────────────────────
  - name: google
    engine: google
    shortcut: go
    use_mobile_ui: false
    timeout: 4.0
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    timeout: 3.5
  - name: bing
    engine: bing
    shortcut: bi
    disabled: true     # Disabled: Bing bot-defense serves random decoy/adult SERPs to SearXNG scrapers
    timeout: 3.5
  - name: brave
    engine: brave
    shortcut: br
    timeout: 3.5
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    timeout: 3.0
  - name: wikidata
    engine: wikidata
    shortcut: wd
    timeout: 3.0
  # Keyless engines the search router prefers (live probe 2026-10-04; zapmeta via PoshTracker).
  # google/mojeek/qwant/yahoo stay available for explicit `engines=` but are not defaults.
  - name: zapmeta
    disabled: false
    timeout: 4.0
  - name: startpage
    disabled: false
    timeout: 4.0
  - name: mwmbl
    disabled: false
    timeout: 4.0
  - name: marginalia
    disabled: false
    timeout: 4.0
  - name: google cse
    disabled: true     # perpetually suspended (429); polluted unresponsive_engines
  - name: ebay
    engine: ebay
    shortcut: eb
    base_url: 'https://www.ebay.com'
    inactive: false
    timeout: 5.0

  # ── IT & Developer Engines ────────────────────────────────────
  - name: github
    engine: github
    shortcut: gh
    categories: [it, repos]
    timeout: 4.0
  - name: gitlab
    engine: gitlab
    shortcut: gl
    categories: [it, repos]
    timeout: 4.0
  - name: stackoverflow
    engine: stackexchange
    api_site: 'stackoverflow'
    shortcut: st
    categories: [it, q&a]
    timeout: 4.0
  - name: crates.io
    engine: crates
    shortcut: crates
    categories: [it, packages, cargo]
    timeout: 3.5
  - name: pypi
    engine: pypi
    shortcut: pypi
    categories: [it, packages]
    timeout: 3.5
  - name: npm
    engine: npm
    shortcut: npm
    categories: [it, packages]
    timeout: 3.5
  - name: arch linux wiki
    engine: archlinux
    shortcut: al
    categories: [it, software wikis]
    timeout: 3.5
  - name: docker hub
    engine: docker_hub
    shortcut: dh
    categories: [it, packages]
    timeout: 4.0
  - name: hackernews
    engine: hackernews
    shortcut: hn
    categories: [it, social media]
    timeout: 3.5

  # ── Scientific & Academic Engines ─────────────────────────────
  - name: arxiv
    engine: arxiv
    shortcut: arx
    categories: [science, scientific publications]
    timeout: 4.5
  - name: crossref
    engine: crossref
    shortcut: cr
    categories: [science, scientific publications]
    timeout: 4.5
  - name: pubmed
    engine: pubmed
    shortcut: pub
    categories: [science, scientific publications]
    timeout: 4.5
  - name: google scholar
    engine: google_scholar
    shortcut: gos
    categories: [science, scientific publications]
    timeout: 4.5
  - name: semantic scholar
    engine: semantic_scholar
    shortcut: se
    categories: [science, scientific publications]
    timeout: 4.5
  - name: europepmc
    engine: europepmc
    shortcut: epmc
    categories: [science, scientific publications]
    timeout: 4.5

  # ── Visual & Image Engines ────────────────────────────────────
  - name: google images
    engine: google_images
    shortcut: goi
    disabled: false
    timeout: 4.0
  - name: bing images
    engine: bing_images
    shortcut: bii
    disabled: false
    timeout: 4.0
  - name: duckduckgo images
    engine: duckduckgo_extra
    categories: [images]
    ddg_category: images
    shortcut: ddi
    disabled: false
    timeout: 4.0
