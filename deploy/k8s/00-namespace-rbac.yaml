apiVersion: v1
kind: Namespace
metadata:
  name: blue-lodge
  labels:
    app.kubernetes.io/part-of: blue-lodge
    field.cattle.io/projectId: p-qjdml
  annotations:
    field.cattle.io/projectId: local:p-qjdml
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: george-operator
  namespace: blue-lodge
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: george-operator-role
  namespace: blue-lodge
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec", "services", "configmaps", "secrets", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: george-operator-binding
  namespace: blue-lodge
subjects:
  - kind: ServiceAccount
    name: george-operator
    namespace: blue-lodge
roleRef:
  kind: Role
  name: george-operator-role
  apiGroup: rbac.authorization.k8s.io
