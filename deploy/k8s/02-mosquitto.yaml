apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: blue-lodge
data:
  mosquitto.conf: |
    listener 1883 0.0.0.0
    allow_anonymous true
    persistence false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: george-mosquitto
  namespace: blue-lodge
  labels:
    app: george-mosquitto
spec:
  replicas: 1
  selector:
    matchLabels:
      app: george-mosquitto
  template:
    metadata:
      labels:
        app: george-mosquitto
    spec:
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2
          ports:
            - containerPort: 1883
              name: mqtt
          volumeMounts:
            - name: config
              mountPath: /mosquitto/config/mosquitto.conf
              subPath: mosquitto.conf
      volumes:
        - name: config
          configMap:
            name: mosquitto-config
---
apiVersion: v1
kind: Service
metadata:
  name: george-mosquitto
  namespace: blue-lodge
spec:
  selector:
    app: george-mosquitto
  ports:
    - name: mqtt
      port: 1883
      targetPort: 1883
