apiVersion: v1
kind: ConfigMap
metadata:
  name: george-env
  namespace: blue-lodge
data:
  LODGE_DIR: "/workspace"
  GEORGE_DIR: "/workspace/.george"
  MODELS_DIR: "/home/user/models"
  PORT: "3000"
  GEORGE_WEB_BIND: "0.0.0.0"
  LLAMA_CPP_URL: "http://george-inference:8080"
  PRISM_URL: "http://george-inference:8080"
  SEARXNG_URL: "http://george-searxng:8080"
  MQTT_BROKER: "george-mosquitto:1883"
  GITEA_URL: "http://gitea-http.gitea.svc.cluster.local:3000"
  K8S_NAMESPACE: "blue-lodge"
  K8S_INFERENCE_URL: "http://george-inference:8080"
  MODEL_HUB_RUNTIME: "k8s"
  LANG: "C.UTF-8"
  LC_ALL: "C.UTF-8"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: george-inference-profile-env
  namespace: blue-lodge
data:
  LLAMA_ARG_MODEL: "/models/hub/huggingface/unsloth/gemma-4-31B-it-GGUF/gemma-4-31B-it-UD-Q4_K_XL.gguf"
  LLAMA_ARG_MMPROJ: "/models/hub/huggingface/unsloth/gemma-4-31B-it-GGUF/mmproj-F16.gguf"
  LLAMA_ARG_MODEL_DRAFT: "/models/hub/huggingface/unsloth/gemma-4-31B-it-GGUF/MTP/mtp-gemma-4-31B-it-Q8_0.gguf"
  LLAMA_ARG_DRAFT: "/models/hub/huggingface/unsloth/gemma-4-31B-it-GGUF/MTP/mtp-gemma-4-31B-it-Q8_0.gguf"
  ENABLE_VISION: "1"
  ENABLE_MTP: "1"
  LLAMA_ARG_SPEC_TYPE: "draft-mtp"
  LLAMA_ARG_SPEC_DRAFT_N_MAX: "4"
  LLAMA_ARG_CTX_SIZE: "98304"
  LLAMA_ARG_N_GPU_LAYERS: "999"
  LLAMA_ARG_N_PARALLEL: "1"
  LLAMA_ARG_UBATCH: "512"
  LLAMA_ARG_BATCH: "2048"
  LLAMA_ARG_FLASH_ATTN: "on"
  LLAMA_ARG_CACHE_TYPE_K: "q4_0"
  LLAMA_ARG_CACHE_TYPE_V: "q4_0"
  LLAMA_ARG_JINJA: "1"
  LLAMA_ARG_HOST: "0.0.0.0"
  LLAMA_ARG_PORT: "8080"
---
apiVersion: v1
kind: Secret
metadata:
  name: george-secrets
  namespace: blue-lodge
type: Opaque
stringData:
  SEARXNG_SECRET: "bluelodge-sovereign-k8s-searxng-secret-2026"
