# ── Blue Lodge Sovereign Dolos Node Configuration ──
# Architecture: TxPipe Dolos v2.0 (Rust)
# Execution Profile: Sliding Window (~35 GB disk, ~1.8 GB RAM)
#
# NOTE: Node is configured for manual activation once dedicated storage (>= 500 GB)
# is attached. By default, autostart is disabled and Blue Lodge operates via Koios fallback.

[upstream]
peer_address = "relay.cnode-m1.demeter.run:3000"

[storage]
version = "v4"
path = "/var/lib/dolos/db"

[genesis]
byron_path = "/etc/dolos/genesis/byron.json"
shelley_path = "/etc/dolos/genesis/shelley.json"
alonzo_path = "/etc/dolos/genesis/alonzo.json"
conway_path = "/etc/dolos/genesis/conway.json"

[sync]
# 36 epochs = 36 * 432,000 slots = 15,552,000 slots (~180 days / ~35 GB disk footprint)
# To use 30 days instead: set max_history = 2592000 (30 * 86,400 slots / ~20 GB disk footprint)
max_history = 15552000
max_rollback = 129600

[serve.ouroboros]
listen_path = "/ipc/node.socket"

[serve.grpc]
listen_address = "0.0.0.0:50051"

[serve.minibf]
listen_address = "0.0.0.0:8000"

[serve.minikupo]
listen_address = "0.0.0.0:1442"

[chain]
type = "cardano"
magic = 764824073
is_testnet = false

[mithril]
aggregator = "https://aggregator.release-mainnet.api.mithril.network/aggregator"
genesis_key = "5b3139312c36362c3134302c3138352c3133382c31312c3233372c3230372c3235302c3134342c32372c322c3138382c33302c31322c38312c3135352c3230342c31302c3137392c37352c32332c3133382c3139362c3231372c352c31342c32302c35372c37392c33392c3137365d"
ancillary_key = "5b32332c37312c39362c3133332c34372c3235332c3232362c3133362c3233352c35372c3136342c3130362c3138362c322c32312c32392c3132302c3136332c38392c3132312c3137372c3133382c3230382c3133382c3231342c39392c35382c32322c302c35382c332c36395d"

[logging]
level = "info"
format = "json"
